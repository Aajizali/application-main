<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipMazaal</title>
  <style>
    /* Reset and full-viewport configuration */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }
    #app {
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
      background-color: #0A0A0A;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <script>
    var origConsoleError = console.error;
    console.error = function() {
      origConsoleError.apply(console, arguments);
      var msg = Array.from(arguments).map(String).join(' ');
      var errDiv = document.createElement('div');
      errDiv.style.color = 'red';
      errDiv.style.padding = '20px';
      errDiv.style.backgroundColor = 'white';
      errDiv.style.position = 'absolute';
      errDiv.style.top = '0';
      errDiv.style.left = '0';
      errDiv.style.zIndex = '9999';
      errDiv.style.width = '100%';
      errDiv.innerText = 'React Error: ' + msg;
      document.body.appendChild(errDiv);
    };
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var errDiv = document.createElement('div');
      errDiv.style.color = 'red';
      errDiv.style.padding = '20px';
      errDiv.style.backgroundColor = 'white';
      errDiv.style.position = 'absolute';
      errDiv.style.top = '0';
      errDiv.style.left = '0';
      errDiv.style.zIndex = '9999';
      errDiv.style.width = '100%';
      errDiv.innerText = 'App crashed: ' + msg + '\n\n' + (error ? error.stack : '');
      document.body.appendChild(errDiv);
    };
  </script>
  <div id="app"></div>
</body>
</html>
